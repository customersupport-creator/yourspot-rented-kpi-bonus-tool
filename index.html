*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;}
#sidebar{width:250px;background:var(--navy-dark);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:100;transition:left .3s;}
.sidebar-header{padding:20px;text-align:center;border-bottom:1px solid var(--border);}
.sidebar-header h2{color:var(--gold);font-size:18px;}
.sidebar-header p{color:var(--text-muted);font-size:12px;margin-top:4px;}
.nav-item{padding:14px 20px;cursor:pointer;display:flex;align-items:center;gap:12px;color:var(--text-muted);transition:all .2s;border-left:3px solid transparent;}
.nav-item:hover{background:var(--navy-light);color:var(--text);}
.nav-item.active{background:var(--navy);color:var(--gold);border-left-color:var(--gold);}
.nav-item i{width:20px;text-align:center;}
#main{margin-left:250px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
#topbar{background:var(--navy);padding:15px 25px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
#topbar h1{font-size:20px;color:var(--gold);}
.topbar-controls{display:flex;align-items:center;gap:15px;}
#monthSelect{background:var(--navy-light);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:14px;}
.hamburger{display:none;background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;}
#content{padding:25px;flex:1;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:25px;}
.stat-card{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);transition:transform .2s;}
.stat-card:hover{transform:translateY(-2px);}
.stat-card .label{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;}
.stat-card .value{font-size:28px;font-weight:700;color:var(--gold);margin:8px 0;}
.stat-card .sub{font-size:12px;color:var(--text-muted);}
.chart-container{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);margin-bottom:25px;}
.chart-container h3{color:var(--gold);margin-bottom:15px;}
.chart-wrap{position:relative;height:300px;}
.form-section{background:var(--card);border-radius:10px;padding:20px;border:1px solid var(--border);margin-bottom:20px;}
.form-section h3{color:var(--gold);margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.form-group{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.form-group label{min-width:280px;font-size:14px;color:var(--text);}
.form-group input,.form-group select{background:var(--navy-light);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:14px;width:120px;}
.form-group select{width:200px;}
.form-group .impact{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;}
.impact-HIGH{background:#e74c3c33;color:#e74c3c;}
.impact-MED-HIGH{background:#ff980033;color:#ff9800;}
.impact-MEDIUM{background:#2196f333;color:#2196f3;}
.impact-LOW-MED{background:#4caf5033;color:#4caf50;}
.form-group .kpi-value{color:var(--gold);font-weight:600;min-width:80px;}
.btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.btn-gold{background:var(--gold);color:var(--navy-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{background:#c0392b;}
.btn-info{background:var(--info);color:#fff;}
.btn-info:hover{background:#1976d2;}
.btn-success{background:var(--success);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
th{background:var(--navy-dark);color:var(--gold);font-size:13px;text-transform:uppercase;letter-spacing:.5px;}
td{font-size:14px;}
tr:hover{background:var(--navy-light);}
.badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;}
.badge-top{background:#4caf5033;color:#4caf50;}
.badge-low{background:#e74c3c33;color:#e74c3c;}
.badge-none{background:#66666633;color:#999;}
.tabs{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:6px 6px 0 0;cursor:pointer;background:var(--navy-dark);color:var(--text-muted);border:1px solid var(--border);border-bottom:none;font-size:13px;transition:all .2s;}
.tab.active{background:var(--card);color:var(--gold);font-weight:600;}
.deduction-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--navy-dark);border-radius:6px;margin-bottom:8px;}
.deduction-item .desc{flex:1;font-size:13px;}
.deduction-item .amt{color:var(--danger);font-weight:600;}
.summary-box{background:var(--navy-dark);border-radius:8px;padding:15px;margin-top:15px;border-left:3px solid var(--gold);}
.summary-box h4{color:var(--gold);margin-bottom:8px;}
.summary-box .row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;}
.summary-box .row .val{color:var(--gold);font-weight:600;}
textarea{background:var(--navy-light);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:6px;width:100%;min-height:80px;font-family:inherit;font-size:14px;resize:vertical;}
.coaching-section{margin-bottom:15px;}
.coaching-section label{display:block;color:var(--gold);margin-bottom:5px;font-weight:600;font-size:14px;}
#toast{position:fixed;bottom:30px;right:30px;background:var(--success);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;z-index:9999;pointer-events:none;}
#toast.show{opacity:1;}
.override-group{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.override-group label{min-width:180px;font-size:13px;color:var(--text-muted);}
.override-group input{width:100px;}
.btn-row{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;}
@media(max-width:768px){
#sidebar{left:-250px;}
#sidebar.open{left:0;}
#main{margin-left:0;}
.hamburger{display:block;}
.stats-grid{grid-template-columns:1fr 1fr;}
}
@media print{
#sidebar,#topbar,.btn,.hamburger,#toast{display:none!important;}
#main{margin-left:0;}
body{background:#fff;color:#000;}
.stat-card,.form-section,.chart-container,.card{background:#fff;border:1px solid #ccc;color:#000;}
th{background:#eee;color:#000;}
.coaching-print{page-break-inside:avoid;}
}
</style>
</head>

function calcIndTierDollar(person,kpiId,attainment,kpi){
if(kpi.attainType==='binary')return attainment>0?kpi.max:0;
const pt=IND_TIERS[person];
if(!pt||!pt[kpiId])return null;
const t=pt[kpiId];const v=parseFloat(attainment)||0;
if(t.type==='lte'){for(const[thresh,dollar]of t.tiers){if(v<=thresh)return dollar;}return 0;}
else{for(const[thresh,dollar]of t.tiers){if(v>=thresh)return dollar;}return 0;}
}
function getMonthlyAttainFromWeekly(person,kpiId,kpi,d,weeks){
const key=person+'_'+kpiId;const wd=d.weeklyInd[key]||{};
const vals=weeks.map(w=>parseFloat(wd[w.id])||0);
const filled=vals.filter(v=>v>0);
if(filled.length===0)return null;
if(kpi.attainType==='avg')return filled.reduce((a,b)=>a+b,0)/filled.length;
if(kpi.attainType==='pct'){let last=null;weeks.forEach(w=>{const v=parseFloat(wd[w.id]);if(v>0)last=v;});return last;}
return vals.reduce((a,b)=>a+b,0);
}
function autoCalcIndDollar(person,kpiId){
const d=getMonthData(currentMonth);const key=person+'_'+kpiId;const oKey='ind_'+key;
if(d.weeklyOverrides&&d.weeklyOverrides[oKey])return;
const kpi=(getKPIsForPerson(person)||[]).find(k=>k.id===kpiId);
if(!kpi)return;
const weeks=getWeekRanges(currentMonth);
const attain=getMonthlyAttainFromWeekly(person,kpiId,kpi,d,weeks);
if(attain===null)return;
const dollar=calcIndTierDollar(person,kpiId,attain,kpi);
if(dollar!==null){if(!d.individual[person])d.individual[person]={};d.individual[person][kpiId]=dollar;}
}

function getWeekRanges(monthKey){
const[y,mo]=monthKey.split('-').map(Number);
const first=new Date(y,mo-1,1);const lastDay=new Date(y,mo,0).getDate();
const weeks=[];let start=1;
const dayOfWeek=first.getDay();
if(dayOfWeek!==1){
const daysToSun=dayOfWeek===0?0:7-dayOfWeek;
const end=Math.min(start+daysToSun,lastDay);
weeks.push({id:'w1',start:start,end:end,label:'Week 1 ('+monthKey.slice(5)+'/'+String(start).padStart(2,'0')+'-'+monthKey.slice(5)+'/'+String(end).padStart(2,'0')+')'});
start=end+1;
}
let wNum=weeks.length+1;
while(start<=lastDay){
const end=Math.min(start+6,lastDay);
weeks.push({id:'w'+wNum,start:start,end:end,label:'Week '+wNum+' ('+monthKey.slice(5)+'/'+String(start).padStart(2,'0')+'-'+monthKey.slice(5)+'/'+String(end).padStart(2,'0')+')'});
start=end+1;wNum++;
}
return weeks;
}

function calcCCTeamKPI(kpi,val){
if(val===''||val===null||val===undefined)return 0;
if(kpi.type==='weekly_avg_ratio'){const sc=calcWeeklyAvgRatio(val);if(sc.weekCount===0)return 0;for(const t of kpi.tiers){if(sc.avg>=t.min&&sc.avg<=t.max)return t.val;}return 0;}
val=parseFloat(val);
if(isNaN(val))return 0;
if(kpi.type==='per_unit')return val*kpi.rate;
if(kpi.type==='percentage_of_total')return val*kpi.rate;
if(kpi.type==='tiered_per_unit'){if(val<=0)return 0;for(const t of kpi.tiers){if(val>=t.min&&val<=t.max)return val*t.rate;}return 0;}
if(kpi.type==='tier'){for(const t of kpi.tiers){if(val>=t.min&&val<=t.max)return t.val;}return 0;}
if(kpi.type==='tier_time')return val;
return 0;
}

function calcEndorsementScore(val){
if(!val||typeof val!=='object')return{ackPct:0,compPct:0,missPct:0,overall:0,weekCount:0};
const wks=Object.keys(val).filter(k=>k.startsWith('w'));
let ackPcts=[],compPcts=[],missPcts=[];
wks.forEach(w=>{const wd=val[w];if(!wd||!wd.total||parseFloat(wd.total)<=0)return;
const t=parseFloat(wd.total),a=parseFloat(wd.acknowledged)||0,c=parseFloat(wd.completed)||0;
ackPcts.push(a/t*100);compPcts.push(c/t*100);missPcts.push((t-c)/t*100);});
if(ackPcts.length===0)return{ackPct:0,compPct:0,missPct:0,overall:0,weekCount:0};
const avgAck=ackPcts.reduce((a,b)=>a+b,0)/ackPcts.length;
const avgComp=compPcts.reduce((a,b)=>a+b,0)/compPcts.length;
const avgMiss=missPcts.reduce((a,b)=>a+b,0)/missPcts.length;
const overall=(avgAck+avgComp+(100-avgMiss))/3;
return{ackPct:avgAck,compPct:avgComp,missPct:avgMiss,overall:overall,weekCount:ackPcts.length};}

function calcWeeklyAvgScore(val){
if(!val||typeof val!=='object')return{avg:0,weekCount:0,weeks:[]};
const wks=Object.keys(val).filter(k=>k.startsWith('w'));
let pcts=[];
wks.forEach(w=>{const v=parseFloat(val[w]);if(!isNaN(v)&&v>0)pcts.push(v);});
if(pcts.length===0)return{avg:0,weekCount:0,weeks:[]};
const avg=pcts.reduce((a,b)=>a+b,0)/pcts.length;
return{avg:avg,weekCount:pcts.length,weeks:pcts};}

function calcWeeklyAvgRatio(val){
if(!val||typeof val!=='object')return{avg:0,weekCount:0,weeks:[]};
const wks=Object.keys(val).filter(k=>k.startsWith('w'));
let pcts=[];
wks.forEach(w=>{const wd=val[w];if(!wd||typeof wd!=='object')return;
const num=parseFloat(wd.numerator)||0,den=parseFloat(wd.denominator)||0;
if(den>0){pcts.push({week:w,numerator:num,denominator:den,pct:num/den*100});}});
if(pcts.length===0)return{avg:0,weekCount:0,weeks:[]};
const avg=pcts.reduce((a,b)=>a+b.pct,0)/pcts.length;
return{avg:avg,weekCount:pcts.length,weeks:pcts};}

function calcListingRevisionScore(val){
if(!val||typeof val!=='object')return{nlTotal:0,nlUpdated:0,nlPct:0,revTotal:0,revUpdated:0,revPct:0,weekCount:0};
const wks=Object.keys(val).filter(k=>k.startsWith('w'));
let nlT=0,nlU=0,revT=0,revU=0,wc=0;
wks.forEach(w=>{const wd=val[w];if(!wd)return;
const nt=parseFloat(wd.nl_total)||0,nu=parseFloat(wd.nl_updated)||0;
const rt=parseFloat(wd.rev_total)||0,ru=parseFloat(wd.rev_updated)||0;
if(nt>0||rt>0)wc++;nlT+=nt;nlU+=nu;revT+=rt;revU+=ru;});
const nlPct=nlT>0?(nlU/nlT*100):0;
const revPct=revT>0?(revU/revT*100):0;
return{nlTotal:nlT,nlUpdated:nlU,nlPct:nlPct,revTotal:revT,revUpdated:revU,revPct:revPct,weekCount:wc};}

function calcAdminTeamKPI(kpi,val){
if(val===''||val===null||val===undefined)return 0;
if(kpi.type==='endorsement_detail'){const sc=calcEndorsementScore(val);if(sc.weekCount===0)return 0;for(const t of kpi.tiers){if(sc.overall>=t.min&&sc.overall<=t.max)return t.val;}return 0;}
if(kpi.type==='weekly_avg_tier'){const sc=calcWeeklyAvgScore(val);if(sc.weekCount===0)return 0;for(const t of kpi.tiers){if(sc.avg>=t.min&&sc.avg<=t.max)return t.val;}return 0;}
if(kpi.type==='weekly_avg_ratio'){const sc=calcWeeklyAvgRatio(val);if(sc.weekCount===0)return 0;for(const t of kpi.tiers){if(sc.avg>=t.min&&sc.avg<=t.max)return t.val;}return 0;}
if(kpi.type==='listing_revision'){const sc=calcListingRevisionScore(val);if(sc.weekCount===0)return 0;return(sc.nlPct>=kpi.threshold&&sc.revPct>=kpi.threshold)?kpi.bonus:0;}
if(kpi.type==='per_unit'){val=parseFloat(val);return isNaN(val)?0:val*kpi.rate;}
if(kpi.type==='percentage_of_total'){val=parseFloat(val);return isNaN(val)?0:val*kpi.rate;}
if(kpi.type==='tiered_per_unit'){val=parseFloat(val);if(isNaN(val)||val<=0)return 0;for(const t of kpi.tiers){if(val>=t.min&&val<=t.max)return val*t.rate;}return 0;}
if(kpi.type==='tier'){val=parseFloat(val);if(isNaN(val))return 0;for(const t of kpi.tiers){if(val>=t.min&&val<=t.max)return t.val;}return 0;}
if(kpi.type==='select')return parseFloat(val)||0;
if(kpi.type==='multi_rate'){if(!val)return 0;if(typeof val!=='object')return parseFloat(val)||0;let t=0;kpi.rates.forEach(r=>{t+=(parseFloat(val[r.id])||0)*r.rate;});return t;}
return 0;
}

function calcProgressiveDeduction(capAmount,numTows){
if(numTows<=0||capAmount<=0)return{total:0,tiers:[],net:capAmount};
let totalDed=0;const tiers=[];
const t1Count=Math.min(numTows,1);
if(t1Count>0){const ded=capAmount*(t1Count*0.10);tiers.push({count:t1Count,rate:10,ded:ded,base:capAmount});totalDed+=ded;}
const t2Count=Math.min(Math.max(numTows-1,0),6);
if(t2Count>0){const ded=capAmount*(t2Count*0.15);tiers.push({count:t2Count,rate:15,ded:ded,base:capAmount});totalDed+=ded;}
const t3Count=Math.max(numTows-7,0);
if(t3Count>0){const ded=capAmount*(t3Count*0.20);tiers.push({count:t3Count,rate:20,ded:ded,base:capAmount});totalDed+=ded;}
return{total:totalDed,tiers:tiers,net:Math.max(0,capAmount-totalDed)};
}

else{teamShare=adminTotal_/adminCount;}

if(m>='2026-07'){const totalPreDed=indTotal+adjTeamShare;const cap=getMaxBonusCap(m,person);const cappedBase=(cap>0&&totalPreDed>cap)?cap:totalPreDed;const progDed=calcProgressiveDeduction(cap>0?cap:cappedBase,personDeds.length);result=Math.max(0,cappedBase-progDed.total)+topBonus;}
else if(m>='2026-06'){const totalPreDed=indTotal+adjTeamShare;const progDed=calcProgressiveDeduction(totalPreDed+topBonus,personDeds.length);result=Math.max(0,totalPreDed+topBonus-progDed.total);}
else{const dedPct=personDeds.length*25;const netInd=indTotal*(1-Math.min(dedPct,100)/100);result=Math.max(0,netInd+adjTeamShare+topBonus);}

function personHasMonthData(m,person){

const comp=getCompetencyRatings(m,person);
for(const c in comp){if(comp[c])return true;}
const pr=d.perfRatings&&d.perfRatings[person];
if(pr&&pr.manualRating)return true;
const tl=d.tlRatings&&d.tlRatings[person];
if(tl){for(const r in tl){const rd=tl[r];if(rd&&rd.competencies){for(const c in rd.competencies){if(rd.competencies[c])return true;}}}}
return false;
}

function calcWeightedPerfScore(m,person){
const kpis=getKPIsForPerson(person);
const d=getMonthData(m);
// For Jul-Dec 2026, return no-data if nothing entered
if(m>='2026-07'&&!personHasMonthData(m,person)){
return{weighted:0,kpiPct:0,towScore:0,towNorm:0,compAvg:0,compCount:0,noData:true};
}
const pData=d.individual[person]||{};
const indTotal=getIndividualTotal(m,person);
const maxTotal=kpis.reduce((s,k)=>s+k.max,0);
const kpiPct=maxTotal>0?Math.min(indTotal/maxTotal*100,100):0;
const towScore=getTowScore(m,person);
const towNorm=(towScore-1)/4*100;
const comp=getCompetencyRatings(m,person);
let compSum=0;let compCount=0;
COMPETENCIES.forEach(c=>{
const v=parseFloat(comp[c])||0;
if(v>0){compSum+=(v-1)/4*100;compCount++;}
});
const compAvg=compCount>0?compSum/compCount:50;
const weighted=kpiPct*0.50+towNorm*0.10+compAvg*0.40;
return{weighted:Math.round(weighted*100)/100,kpiPct:Math.round(kpiPct),towScore,towNorm:Math.round(towNorm),compAvg:Math.round(compAvg),compCount,noData:false};
}
